# ═══════════════════════════════════════════════
# 雀魂机器人配置 — config.example.yaml
# 复制为 config.yaml 并填写账号信息
# ═══════════════════════════════════════════════

# 雀魂账号
account:
  username: ""             # 邮箱
  password: ""             # 密码

# 匹配设置
match:
  # 模式: rank (段位赛) / ai (AI对战/友人房)
  mode: "ai"
  # 房间类型: 4e (四人东) / 4s (四人南) / 3e (三人东) / 3s (三人南)
  room_type: "4e"
  # 段位场等级 (仅 rank 模式):
  #   copper (铜之间) / silver (银之间) / gold (金之间)
  #   jade (玉之间) / throne (王座之间)
  level: "copper"

# AI 设置
ai:
  # AI 类型:
  #   basic   — 基础规则AI (打客风→幺九，碰役牌)     ⭐
  #   shanten — 向听数贪心 (断线重连 fallback)        ⭐⭐
  #   mortal  — Mortal 深度学习 (需配置权重文件)       ⭐⭐⭐⭐⭐
  type: "basic"

  # 装弱模式 (反 AI 检测):
  # 第一名时每局自己的前 N 手出牌用 Mortal Q 值 softmax 随机采样
  # 偶尔打次优牌但不会打出离谱的牌，超过 N 手后恢复正常
  # 设为 0 关闭
  # nerf_turns: 10

  # 全局决策扰动 (降低 AI 重合度):
  # 每手牌有 noise_rate 概率不选 Mortal 最优解，而是从 Q 值分布中采样次优牌
  # 用于降低与公开 Mortal 模型的出牌重合率，避免被服务端 AI 检测识别
  # noise_rate: 0.0-1.0 (推荐 0.05-0.08，即 5-8%)
  # noise_temperature: softmax 温度
  #   0.3 = 几乎只选第2优 (前2优占 89%)
  #   0.5 = 推荐 (前2优占 75%, 偶尔第3优)
  #   1.0 = 较随机 (前2优占 59%, 会选到差牌)
  #   2.0+ = 接近均匀随机 (不推荐)
  noise_rate: 0.06
  noise_temperature: 0.5

# 表情设置
emoji:
  enabled: true
  on_win: true             # 和牌时发表情
  win_emojis: [2, 6, 7]   # 和牌表情 ID（随机选一个）
  on_riichi: true          # 立直时发表情
  riichi_emojis: [3, 8]   # 立直表情 ID（随机选一个）

# 运行设置
run:
  # 连续打几局后停止 (0 = 不限制)
  max_games: 1
  # 日志级别: DEBUG / INFO / WARNING
  log_level: "INFO"

  # ── 反检测: 节奏控制 ──
  # 模拟真人打牌节奏，避免机器人特征被风控检测
  #
  # 局间间隔: 每局之间随机等待 45-180 秒
  # 另有 15% 概率模拟 AFK (上厕所/喝水)，额外 +60-180 秒
  game_interval_min: 45    # 局间最短间隔(秒)
  game_interval_max: 180   # 局间最长间隔(秒)
  #
  # Session 机制: 每打 6-15 局休息 5-15 分钟
  # 模拟真人不会连续打太久
  session_games_min: 6     # 每个 session 最少几局
  session_games_max: 15    # 每个 session 最多几局
  session_break_min: 300   # session 休息最短(秒) = 5 分钟
  session_break_max: 900   # session 休息最长(秒) = 15 分钟
  #
  # 活跃时段: 只在指定时段内打牌
  # 超过 24 表示跨日 (如 25 = 次日 1:00)
  active_hour_start: 9     # 9:00 开始
  active_hour_end: 25      # 次日 1:00 结束
  night_stop: true         # 凌晨自动停止，等到 active_hour_start 恢复

# 遥测设置 (反检测)
# 模拟真实客户端的行为日志上报 (HTTP → 阿里云 SLS)
# 包括: bi_trace 行为埋点, clickLogMap 点击统计, lobbyCostTime 页面停留
telemetry:
  enabled: true            # 启用 HTTP 行为日志上报
