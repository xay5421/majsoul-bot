# Mortal 离线训练配置 — 5070 GPU
# 基于 config.example.toml，适配本地训练

[control]
version = 4
online = false

state_file = 'train_state.pth'
best_state_file = 'best_state.pth'
tensorboard_dir = 'runs/mortal_train'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true          # 5070 支持 fp16/bf16，开启 AMP 加速
enable_compile = false     # torch.compile 可选，初次训练先关闭

batch_size = 512
opt_step_every = 1

save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = 'test_play_logs'

[dataset]
globs = ['data/mjai/**/*.json.gz']
file_index = 'file_index.pth'
file_batch_size = 15
reserve_ratio = 0.0
num_workers = 2
player_names_files = []    # 空 = 所有玩家，不做筛选
num_epochs = 1
enable_augmentation = false
augmented_first = false

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]    # 天凤凤凰卓顺位点

# ★ 模型架构 — 可调大以提升能力
# mini: conv_channels=32, num_blocks=2 (1.27M params, 公开权重)
# medium: conv_channels=96, num_blocks=12 (~10M params)
# large: conv_channels=128, num_blocks=20 (~25M params)
# full: conv_channels=192, num_blocks=40 (~100M params, 作者线上版)
[resnet]
conv_channels = 128
num_blocks = 20

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 100000     # 根据数据量调整

# baseline 用于 test_play 的对手（用 mini 权重即可）
[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'mortal.pth'    # 预训练 mini 作为 baseline

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'mortal.pth'

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = 'buffer'
drain_dir = 'drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '1v3_logs'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = 'train_state.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = 'mortal.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = ''
tactics = ''

# GRP 模型（Game Result Predictor）
[grp]
state_file = 'grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_train'
batch_size = 512
save_every = 2000
val_steps = 400

[grp.dataset]
# 训练/验证拆分：用较早年份训练，较近年份验证
train_globs = [
    'data/mjai/2019/**/*.json.gz',
    'data/mjai/2020/**/*.json.gz',
    'data/mjai/2021/**/*.json.gz',
    'data/mjai/2022/**/*.json.gz',
    'data/mjai/2023/**/*.json.gz',
]
val_globs = [
    'data/mjai/2024/**/*.json.gz',
    'data/mjai/2025/**/*.json.gz',
]
file_index = 'grp_file_index.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-5
